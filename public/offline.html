<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18181b">
    <title>Sem conexão — Jornada</title>
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: #f5f5f4;
            color: #18181b;
        }

        main {
            width: 100%;
            max-width: 30rem;
            border: 1px solid #e7e5e4;
            border-radius: 1.25rem;
            background: #fff;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 1px 3px rgb(24 24 27 / 0.06);
        }

        img {
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 1rem;
            display: block;
            margin: 0 auto 1.25rem;
        }

        .marca {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 1.5rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #71717a;
        }

        .ponto {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: #2dd4bf;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            line-height: 1.2;
            letter-spacing: -0.025em;
        }

        p {
            margin: 0.75rem 0 0;
            color: #52525b;
            font-size: 0.9rem;
            line-height: 1.65;
        }

        button {
            width: 100%;
            margin-top: 1.5rem;
            border: 0;
            border-radius: 0.75rem;
            background: #0f766e;
            padding: 0.8rem 1.25rem;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        button:focus-visible {
            outline: 3px solid rgb(13 148 136 / 0.35);
            outline-offset: 2px;
        }

        small {
            display: block;
            margin-top: 1.25rem;
            color: #a1a1aa;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <main>
        <img src="/assets/brand/app-icon-192.png" alt="" width="72" height="72">
        <span class="marca"><span class="ponto" aria-hidden="true"></span> JORNADA · PONTO &amp; AUDITORIA</span>
        <h1>Você está offline</h1>
        <p>Não foi possível conectar ao servidor. Seus registros continuam salvos; verifique a internet e tente novamente.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <small>O Jornada volta a funcionar assim que a conexão for restabelecida.</small>
    </main>
</body>
</html>
