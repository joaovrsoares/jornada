server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # Fotos de celular podem chegar maiores que o padrão de 1 MB do nginx.
    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass php:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}