server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # Fotos de celular podem chegar maiores que o padrão de 1 MB do nginx.
    client_max_body_size 16m;

    # O service worker precisa ser servido da raiz e nunca ficar preso em cache.
    location = /sw.js {
        default_type application/javascript;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Página de fallback offline do PWA.
    location = /offline.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # O manifest da PWA precisa do MIME type correto (o mime.types do Alpine
    # não reconhece .webmanifest e cairia em application/octet-stream).
    location = /assets/brand/site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}