services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: jornada
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - .:/var/www
      - jornada_db_data:/var/lib/mysql
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-jornada}
      DB_USERNAME: ${DB_USERNAME:-jornada}
      DB_PASSWORD: ${DB_PASSWORD:-jornada_dev}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    networks:
      web:
        aliases:
          - jornada

volumes:
  jornada_db_data:

networks:
  web:
    external: true
    name: docker_web
